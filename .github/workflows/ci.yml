name: CI

# Run the test suite on every PR and on pushes to main, so nothing merges red.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range (pyproject: requires-python >= 3.11).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable install so `python -m driftscope` works (the SIGTERM test spawns it),
      # plus the dev extra (pytest). No runtime deps to install -- the tool is stdlib-only.
      - name: Install
        run: python -m pip install -e ".[dev]"

      # Deterministic, offline suite -- the required signal. The @pytest.mark.network
      # tests hit real registries/GitHub and can't pass without credentials/network, so
      # they run separately (network-tests job) and never block a merge.
      - name: Test
        run: python -m pytest -q -m "not network"

  # Opt-in coverage of the network tests, authenticated with the Actions-issued
  # GITHUB_TOKEN (raises the GitHub API limit 60 -> ~1000/hr). NON-BLOCKING:
  # a rate-limited or down external registry must not fail a PR.
  network-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Network tests (non-blocking)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest -q -m network
