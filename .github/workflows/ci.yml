name: CI

# Run the test suite on every PR and on pushes to main, so nothing merges red.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range (pyproject: requires-python >= 3.11).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable install so `python -m driftscope` works (the SIGTERM test spawns it),
      # plus the dev extra (pytest). No runtime deps to install -- the tool is stdlib-only.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
