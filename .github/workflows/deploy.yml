# GATED promotion pipeline (Phase 0.6d + gated-promotion). Build ONCE, promote the SAME digest up the
# dev -> staging -> prod ladder, with a gate before every environment above dev. PULL-based GitOps
# (ADR 0002): the pipeline only bumps a committed image pointer (overlays/<env>/kustomization.yaml
# newTag); each cluster's Argo CD reconciles its own overlay. CI never runs kubectl / holds no cluster
# credential.
#
# THE LADDER + THE GATES
#   * push to main     -> BUILD+sign vX.Y.Z (also tag sha-<gitsha> + OCI labels); bump overlays/dev
#                         newTag = vX.Y.Z@<digest> (digest-PINNED). dev is the ONE auto env — no gate.
#   * push tag vX.Y.Z  -> PROMOTE to staging, GATED by:
#                          (1) verify-prev: dev must be HEALTHY (automated /healthz soak), and
#                          (2) HITL: a human chose to cut tag vX.Y.Z (+ required-reviewers if enabled).
#                         Then COPY dev's pinned vX.Y.Z@<digest> into overlays/staging (no rebuild).
#   * publish release  -> PROMOTE to prod, GATED by verify-prev (staging healthy) + the human release
#                         act. COPY staging's pinned vX.Y.Z@<digest> into overlays/prod.
#
# THE HUMAN-IN-THE-LOOP (HITL). The gate before each env is two-part: an automated check that the
# PREVIOUS env is healthy (`verify-prev`), and a human decision. On THIS repo (private, free plan)
# GitHub Environment *required-reviewers* are unavailable, so the HITL is the explicit human act of
# tagging (staging) / publishing a release (prod) — nothing promotes itself. Each promote job still
# targets a GitHub `environment:`, so making the repo public or upgrading to Pro/Team and adding
# required-reviewers on `staging`/`production` adds an explicit approve-click pause AFTER verify-prev,
# with no workflow change.
#
# ISOLATION. Each GitHub Environment is federated to its own driftscope-<env>-gh-deploy identity
# (`vars.AZURE_CLIENT_ID` resolves environment-scoped), so one env's job can't authenticate to
# another's Azure. Promotion is pure git (copy the pinned digest) — it needs NO Azure at all, so a
# promote job can never touch a registry. A version can only be promoted after the previous env is
# digest-pinned on it (dev builds it first), which enforces build-once.
#
# ── Prerequisites (all reproducible — no manual GitHub-UI setup) ──────────────────────────────
#   `make repo-config ENV=<env>` sets, per GitHub Environment, AZURE_CLIENT_ID + the TFVARS secret,
#   and (to arm the automated gate) APP_URL = that env's public base URL. Repo-level: ACR_NAME /
#   AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID. If APP_URL is unset the automated gate no-ops with a
#   warning (the human tag/release act still gates). `contents: write` pushes the pointer-bump commit.
# ─────────────────────────────────────────────────────────────────────────────────────────────
name: deploy

on:
  # dev: every merge to main builds the next patch version and bumps overlays/dev (Argo reconciles).
  # staging: pushing a version tag vX.Y.Z promotes an ALREADY-built image.
  # NOTE: no `paths-ignore` here — combining it with `tags:` can silently suppress tag pushes (a
  # GitHub path-filter gotcha). Doc-only main merges are skipped deterministically in the plan job.
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # prod: publishing a release promotes that exact vX.Y.Z to prod.
  release:
    types: [published]
  # Manual: build a throwaway sha test image (not promoted). No env pointer is touched.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "vX.Y.Z to build for testing (blank = throwaway sha image). Never promoted."
        required: false
        default: ""

permissions:
  contents: write          # push the overlay pointer-bump commit to main (Argo then reconciles)
  id-token: write          # Azure OIDC + cosign keyless

concurrency:
  # ONE group for the whole workflow: dev merges and staging/prod promotions all push a pointer bump
  # to main, so serialize them — otherwise two concurrent runs race a non-fast-forward push.
  group: deploy-driftscope
  cancel-in-progress: false   # never cancel a deploy mid-rollout

jobs:
  # ── PLAN: one place decides mode/env/overlay/version; the jobs below consume it via `needs`. Pure
  #    git + logic (no Azure), so it can run without an environment. ──────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      env: ${{ steps.plan.outputs.env }}
      overlay: ${{ steps.plan.outputs.overlay }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 to detect image-affecting changes (deterministic build vs skip)
      - name: Resolve mode + version + target overlay
        id: plan
        run: |
          # MODE = build (dev, on main) | promote (staging/prod, on tag/release) | test (dispatch).
          # ENV / OVERLAY = which per-env overlay pointer gets bumped.
          if [ "${{ github.event_name }}" = "release" ]; then
            MODE=promote; ENVN=production; OVERLAY=prod; TAG="${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            MODE=promote; ENVN=staging;    OVERLAY=staging; TAG="${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # dev: auto-bump the PATCH from overlays/dev's committed newTag (continuous deployment).
            # Build ONLY when an IMAGE-affecting file changed: the app package, its build inputs, or the
            # Dockerfile (this list mirrors the Dockerfile COPYs). Infra (terraform/), the monitoring
            # stack, GitOps render, bootstrap scripts, workflows, overlays/config, and docs never change
            # the image, so they MUST NOT trigger an app rebuild+deploy -- app delivery and infra
            # delivery are separate lifecycles. Deterministic in-step replacement for a paths filter
            # (which can't sit next to `tags:`); the `! grep -q` form is also what shellcheck prefers.
            IMG_PATHS='^(driftscope/|docker/|Dockerfile$|pyproject\.toml$)'
            if git rev-parse HEAD~1 >/dev/null 2>&1 \
               && ! git diff --name-only HEAD~1 HEAD | grep -qE "$IMG_PATHS"; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "::notice::no image-affecting change (app source / Dockerfile) -> nothing to build/deploy"
              exit 0
            fi
            MODE=build; ENVN=dev; OVERLAY=dev
            CUR=$(awk '/name: driftscope$/{f=1} f&&/newTag:/{print $2; exit}' deploy/overlays/dev/kustomization.yaml)
            CUR="${CUR%@*}"   # strip any digest pin
            if printf '%s' "$CUR" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              base="${CUR#v}"; ma="${base%%.*}"; rest="${base#*.}"; mi="${rest%%.*}"; pa="${rest##*.}"
              TAG="v${ma}.${mi}.$((pa+1))"
            else
              TAG="v0.0.1"   # committed tag wasn't plain semver -> seed the patch line
            fi
          elif [ -n "${{ inputs.image_tag }}" ]; then
            MODE="test"; ENVN=dev; OVERLAY=""; TAG="${{ inputs.image_tag }}"
          else
            MODE="test"; ENVN=dev; OVERLAY=""; TAG="sha-$(git rev-parse --short HEAD)"
          fi
          {
            echo "mode=${MODE}"
            echo "env=${ENVN}"
            echo "overlay=${OVERLAY}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::mode=${MODE} env=${ENVN} version=${TAG}"

  # ── BUILD (dev, on merge to main) + dispatch-test. dev is the ONE auto env — NO gate. Server-side
  #    build in the SHARED ACR, sign keyless, and (build only) digest-PIN overlays/dev. ────────────
  build:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'build' || needs.plan.outputs.mode == 'test' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC, keyless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}       # environment-scoped: dev's gh-deploy UAMI
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build & sign
        id: build
        run: |
          # az acr build uses the classic (non-BuildKit) builder, which does NOT auto-populate
          # TARGETARCH (the Dockerfile's gh-CLI stage keys off it) — pass it + --platform explicitly
          # for the amd64 AKS nodes. (See .claude/skills/build-driftscope-image.)
          # Tag with BOTH the version AND sha-<gitsha> (traceability), and stamp the source commit +
          # version as OCI labels — so any running digest traces back to its exact commit.
          GITSHA="$(git rev-parse HEAD)"
          SHATAG="sha-$(git rev-parse --short HEAD)"
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "driftscope:${{ needs.plan.outputs.tag }}" \
            --image "driftscope:${SHATAG}" \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --build-arg GIT_SHA="${GITSHA}" \
            --build-arg IMAGE_VERSION="${{ needs.plan.outputs.tag }}" \
            --file Dockerfile .
          DIGEST=$(az acr repository show \
            --name "${{ vars.ACR_NAME }}" \
            --image "driftscope:${{ needs.plan.outputs.tag }}" \
            --query digest -o tsv)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "::notice::built ${{ needs.plan.outputs.tag }} (+ ${SHATAG}) @ ${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign the image (keyless)
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          cosign sign --yes "${{ vars.ACR_NAME }}.azurecr.io/driftscope@${{ steps.build.outputs.digest }}"

      - name: Bump overlays/dev on main (digest-PINNED; Argo reconciles)
        if: ${{ needs.plan.outputs.mode == 'build' }}
        run: |
          NEWTAG="${{ needs.plan.outputs.tag }}@${{ steps.build.outputs.digest }}"   # dev pinned at build (no drift)
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s|^\( *newTag:\).*|\1 ${NEWTAG}|" deploy/overlays/dev/kustomization.yaml
          git config user.name  "driftscope-deploy[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "::notice::dev already on ${NEWTAG}; nothing to bump"
          else
            # NO [skip ci]: a GITHUB_TOKEN push already doesn't retrigger workflows (so no build loop),
            # and [skip ci] on this commit would make a later `git tag`/release on HEAD get silently
            # skipped -- the tag would land on a [skip ci] commit and never fire the promotion.
            git commit -m "chore(deploy): dev -> ${NEWTAG}"
            git push origin main
            echo "::notice::bumped dev to ${NEWTAG} on main; dev's Argo CD will reconcile it"
          fi

      - name: Test image (not promoted)
        if: ${{ needs.plan.outputs.mode == 'test' }}
        run: echo "::notice::built + signed driftscope:${{ needs.plan.outputs.tag }} for testing; not promoted (merge to main to deploy to dev, then tag/release to promote)"

  # ── GATE part 1 (automated): the PREVIOUS env must be HEALTHY before we promote. Because CD is
  #    decoupled from the cluster (CI holds no cluster credential), verify from the OUTSIDE: poll the
  #    previous env's public /healthz and require a short healthy soak. `environment:` = the PREVIOUS
  #    env, so `vars.APP_URL` resolves to that env's URL. Blocks `promote` on failure. ─────────────
  verify-prev:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'promote' }}
    runs-on: ubuntu-latest
    # staging promotion verifies dev; prod promotion verifies staging.
    environment: ${{ github.event_name == 'release' && 'staging' || 'dev' }}
    steps:
      - name: Verify the previous environment is healthy
        run: |
          PREV="${{ github.event_name == 'release' && 'staging' || 'dev' }}"
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::APP_URL is not set on the '${PREV}' GitHub Environment — the automated health"
            echo "::warning::gate is SKIPPED (the human tag/release act still gates this promotion). Set"
            echo "::warning::APP_URL=<${PREV} base url> (via 'make repo-config ENV=${PREV}') to arm it."
            exit 0
          fi
          base="${URL%/}"
          echo "::notice::gate: polling ${base}/healthz — need 3 consecutive 200s (soak) within ~5 min"
          soak=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${base}/healthz" 2>/dev/null || echo 000)
            echo "  [$i] ${base}/healthz -> ${code}"
            if [ "$code" = "200" ]; then soak=$((soak+1)); else soak=0; fi
            if [ "$soak" -ge 3 ]; then
              echo "::notice::${PREV} healthy + soaked (${soak} consecutive 200s) — gate PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${PREV} never reached a stable healthy state at ${base}/healthz — BLOCKING the"
          echo "::error::promotion. (Fix ${PREV}, or if it is genuinely healthy check APP_URL / the FD probe.)"
          exit 1
      # UPGRADE PATH: confirming the previous env runs the EXACT promoted @sha256 (not just "healthy")
      # needs an in-cluster signal — either an app /version endpoint to assert against, or Argo CD
      # Notifications emitting a `Healthy on revision <sha>` webhook to wait on (no cluster credential
      # in CI either way). Health + soak is the reliable external signal until that is wired.

  # ── GATE part 2 (HITL) + the PROMOTION. `environment:` = the TARGET env: the approval anchor (arms
  #    required-reviewers if the plan supports it) and the human tag/release act is the gate. Promotion
  #    is PURE GIT — copy the previous env's pinned digest — so this job needs NO Azure. ────────────
  promote:
    needs: [plan, verify-prev]
    if: ${{ needs.plan.outputs.mode == 'promote' }}
    runs-on: ubuntu-latest
    # staging on a tag, production on a release. Required-reviewers on these (public/paid repos) pause
    # the job here AFTER verify-prev — an explicit approve-click before the bump.
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # NO rebuild, NO re-resolution from a mutable tag. COPY the exact digest-pinned reference the
      # PREVIOUS env is running (dev->staging, staging->prod). The version->digest binding was recorded
      # when dev built it; promotion carries it forward verbatim, so every env provably runs ONE
      # artifact (closes red-team R3). A version guard fails closed on a version mismatch.
      - name: Resolve pinned reference to promote (copy from the previous env)
        id: promote
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          case "${{ needs.plan.outputs.overlay }}" in
            staging) PREV=dev ;;
            prod)    PREV=staging ;;
            *) echo "::error::unexpected overlay '${{ needs.plan.outputs.overlay }}'"; exit 1 ;;
          esac
          PINNED=$(awk '/name: driftscope$/{f=1} f&&/newTag:/{print $2; exit}' "deploy/overlays/${PREV}/kustomization.yaml")
          case "$PINNED" in
            *@sha256:*) : ;;
            *) echo "::error::${PREV} is not digest-pinned (newTag='${PINNED}') — it must be built by the dev pipeline before it can be promoted."; exit 1 ;;
          esac
          PREV_VERSION="${PINNED%@*}"
          if [ "$PREV_VERSION" != "$TAG" ]; then
            echo "::error::promoting ${TAG} but ${PREV} runs ${PREV_VERSION}. Promote the version ${PREV} actually validated (tag/release ${PREV_VERSION}), or roll ${PREV} to ${TAG} first."
            exit 1
          fi
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "::notice::promoting ${PINNED} (copied from ${PREV}) to ${{ needs.plan.outputs.env }}"

      - name: Bump env pointer on main (GitOps — Argo reconciles)
        run: |
          ENVN="${{ needs.plan.outputs.env }}"
          OVERLAY="${{ needs.plan.outputs.overlay }}"
          NEWTAG="${{ steps.promote.outputs.pinned }}"          # copied verbatim from the previous env
          # The bump belongs on main (Argo tracks it), regardless of the triggering ref (a tag/release).
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s|^\( *newTag:\).*|\1 ${NEWTAG}|" "deploy/overlays/${OVERLAY}/kustomization.yaml"
          git config user.name  "driftscope-deploy[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "deploy/overlays/${OVERLAY}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "::notice::${ENVN} already on ${NEWTAG}; nothing to bump"
          else
            # NO [skip ci]: the GITHUB_TOKEN push already doesn't retrigger workflows (no dev-build
            # loop), and a [skip ci] here would make a later `git tag`/release on HEAD get silently
            # skipped — so promotion by tagging the latest commit would never fire.
            git commit -m "chore(deploy): ${ENVN} -> ${NEWTAG}"
            git push origin main
            echo "::notice::bumped ${ENVN} to ${NEWTAG} on main; ${ENVN}'s Argo CD will reconcile it"
          fi
