# Build + sign the image into ACR and bump the deployed version in git (app + fleet governance).
#
# This is the *deploy* pipeline. `release.yml` publishes the public, signed image to GHCR; this one
# builds the image the CLUSTER actually pulls (ACR, via kubelet AcrPull). Since ADR 0002 phase 4 it
# is PULL-based GitOps: the pipeline builds + signs, then bumps the committed image tag
# (kustomization.yaml newTag) on main -- it does NOT apply manifests. Argo CD reconciles the bump
# onto the cluster (auto-sync + selfHeal), so CI holds no cluster-admin credential.
#
# CONTINUOUS DEPLOYMENT: every merge to main auto-bumps the patch version and deploys it (code
# changes only -- doc-only merges are path-ignored). A published release deploys a marked vX.Y.Z.
# Merges are pre-tested by the PR's CI (ci.yml on pull_request); enable branch protection on main so
# a direct, un-reviewed push can't ship untested. First-time cluster infra (Istio, mesh/, edge/,
# gateway, Argo itself) is stood up by the bootstrap.
#
# Auth is Azure OIDC -- the same keyless, secretless pattern terraform.yml uses. No stored
# credentials: a federated credential on the Azure identity trusts this repo's Actions subject.
#
# ── Prerequisites (all reproducible -- no manual GitHub-UI setup) ────────────────────────────
#   Repo *variables* AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID / ACR_NAME are set
#   by `make repo-config` (scripts/bootstrap/repo-config.sh) from Terraform outputs. The deploy
#   identity itself -- the driftscope-gh-deploy UAMI, its AcrPush/Contributor grants, and the
#   federated credential trusting repo:<owner>/<repo>:environment:production -- is Terraform
#   (terraform/gh-deploy-identity.tf). No AKS/kubectl access is needed -- Argo CD applies;
#   `contents: write` (below) lets the job push the tag-bump commit to main.
# ─────────────────────────────────────────────────────────────────────────────────────────────
name: deploy

on:
  # Continuous deployment: every merge to main builds the next patch version and deploys it
  # (Argo reconciles the bumped newTag). Doc-only merges are skipped -- they don't change the image.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  # A published GitHub release deploys that exact vX.Y.Z (a marked minor/major release).
  release:
    types: [published]
  # Manual: an explicit vX.Y.Z promotes+deploys it; no tag builds a throwaway sha test image.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "vX.Y.Z to build & deploy (blank = throwaway sha test image, not promoted)."
        required: false
        default: ""

permissions:
  contents: write          # push the image-tag bump commit to main (Argo then reconciles)
  id-token: write          # Azure OIDC + cosign keyless

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deploy mid-rollout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production     # gate: required reviewers / env protection apply here
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, keyless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tag + promote flag
        id: tag
        run: |
          # The deployed version is a SEMANTIC VERSION in git (ADR 0002 phase 4). PROMOTE = build it
          # and bump kustomization.yaml newTag (Argo deploys). Cases:
          #   * merge to main -> auto-bump the PATCH from the committed newTag (continuous deployment)
          #   * a release / a dispatch vX.Y.Z -> that exact version (marked minor/major release)
          #   * a plain dispatch -> throwaway sha test image, NOT promoted (no sha tags on main)
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"; PROMOTE=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            CUR=$(awk '/name: driftscope$/{f=1} f&&/newTag:/{print $2; exit}' deploy/overlays/cloud/kustomization.yaml)
            if printf '%s' "$CUR" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              base="${CUR#v}"; ma="${base%%.*}"; rest="${base#*.}"; mi="${rest%%.*}"; pa="${rest##*.}"
              TAG="v${ma}.${mi}.$((pa+1))"
            else
              TAG="v0.0.1"   # committed tag wasn't plain semver -> seed the patch line
            fi
            PROMOTE=true
          elif [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
            printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' && PROMOTE=true || PROMOTE=false
          else
            TAG="sha-$(git rev-parse --short HEAD)"; PROMOTE=false
          fi
          ACR="${{ vars.ACR_NAME }}"
          {
            echo "tag=${TAG}"
            echo "promote=${PROMOTE}"
            echo "image=${ACR}.azurecr.io/driftscope:${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::building ${ACR}.azurecr.io/driftscope:${TAG} (promote=${PROMOTE})"

      # Server-side build in ACR: no docker daemon on the runner, and the image lands in the
      # registry the cluster pulls from. Same Dockerfile + platform the app is deployed as.
      - name: Build & push to ACR
        id: build
        run: |
          # az acr build does NOT auto-populate the BuildKit platform args (TARGETARCH), which the
          # Dockerfile's gh-CLI stage keys off -- so pass it explicitly for the platform we deploy.
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "driftscope:${{ steps.tag.outputs.tag }}" \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --file Dockerfile .
          DIGEST=$(az acr repository show \
            --name "${{ vars.ACR_NAME }}" \
            --image "driftscope:${{ steps.tag.outputs.tag }}" \
            --query digest -o tsv)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2

      # Sign the ACR image keyless (Fulcio/Rekor), matching release.yml's supply-chain posture.
      # az login already populated docker creds for ACR via the OIDC token.
      - name: Sign the image (keyless)
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          cosign sign --yes "${{ vars.ACR_NAME }}.azurecr.io/driftscope@${{ steps.build.outputs.digest }}"

      # ADR 0002 phase 4: the pipeline's job ends at "build + sign + declare intent". For a real
      # version (promote=true) it bumps the committed newTag on main; Argo CD (auto-sync + selfHeal)
      # reconciles it. No kubectl, no cluster-admin credential -- Argo is the sole applier.
      - name: Promote version on main (GitOps -- Argo reconciles)
        if: ${{ steps.tag.outputs.promote == 'true' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Build happened against the triggering ref; the version bump belongs on main (Argo tracks it).
          git fetch origin main
          git checkout -B main origin/main
          # newTag is the single source of truth for the deployed version (kustomization.yaml).
          sed -i "s|^\( *newTag:\).*|\1 ${TAG}|" deploy/overlays/cloud/kustomization.yaml
          git config user.name  "driftscope-deploy[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/cloud/kustomization.yaml
          if git diff --cached --quiet; then
            echo "::notice::already on ${TAG}; nothing to bump"
          else
            # [skip ci]: this commit only moves a version tag. A GITHUB_TOKEN push does not retrigger
            # workflows regardless, so there is no deploy loop.
            git commit -m "chore(deploy): ${TAG} [skip ci]"
            git push origin main
            echo "::notice::promoted ${TAG} on main; Argo CD will reconcile it"
          fi

      - name: Test image (not promoted)
        if: ${{ steps.tag.outputs.promote != 'true' }}
        run: echo "::notice::built + signed ${{ steps.tag.outputs.image }} for testing; not promoted to main (cut a vX.Y.Z release to deploy)"
