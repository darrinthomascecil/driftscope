# The Argo CD Application for driftscope (app + fleet), ADR-0002. Argo renders the placeholder
# overlay via the driftscope-render CMP (which runs deploy/gitops/render-overlay.sh), so it can
# reconcile a repo that never holds live values.
#
# Pull-based GitOps (ADR 0002 phase 4): Argo CD reconciles the app + fleet from git, rendering the
# overlay via the driftscope-render CMP. The deploy pipeline builds/signs the image and bumps the
# committed tag (kustomization.yaml newTag); Argo rolls it out. CI holds no cluster credential.
#
# repoURL is a placeholder (ADR 0001: nothing fork-specific committed). The bootstrap
# (scripts/bootstrap/cluster-init.sh) fills it from the checkout's own `git remote origin`, so a
# fork-and-rebuild registers against the forker's repo with no edit here.
#
# The image-tag cutover gate is CLOSED: the CMP and the pipeline both render the committed newTag
# (render-overlay.sh no longer takes a tag override), so auto-sync + selfHeal cannot fight the
# pipeline over the running image. That is why automated syncPolicy is enabled below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: driftscope
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE-REPO         # bootstrap fills from `git remote origin` (e.g. git@github.com:owner/driftscope.git)
    targetRevision: main
    path: .                       # repo root, so the plugin's generate cmd resolves deploy/gitops/*
    plugin:
      name: driftscope-render-v1.0   # <ConfigManagementPlugin name>-<version>
  destination:
    server: https://kubernetes.default.svc
    namespace: driftscope
  syncPolicy:
    # Auto-heal drift and reconcile the pipeline's tag bumps. prune removes resources deleted from
    # git (the ESO-created oauth2-proxy Secret is NOT git-tracked, so it is never pruned).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true   # the driftscope namespace is created by the bootstrap; harmless if present
