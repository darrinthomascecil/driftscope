apiVersion: v1
kind: Service
metadata:
  name: driftscope
  labels:
    app.kubernetes.io/name: driftscope
spec:
  # ClusterIP: in-cluster only. Reach it from your laptop with
  #   kubectl port-forward svc/driftscope 8080:8080
  # rather than exposing it -- the service clones arbitrary repo URLs, so it should
  # not be a LoadBalancer/NodePort without deliberate network controls in front.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: driftscope
  ports:
    - name: http
      port: 8080
      targetPort: http
