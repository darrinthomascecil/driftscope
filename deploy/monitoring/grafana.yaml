# Grafana for the mesh-security signals. Internal only (ClusterIP; reach via
# `kubectl -n monitoring port-forward svc/grafana 3000:3000`). Out of the mesh, like
# Prometheus. Anonymous viewer is enabled for read-only convenience on an internal tool;
# the admin password is a Secret. Datasource + one security dashboard are provisioned.
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: monitoring }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboard-provider, namespace: monitoring }
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: security
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboards, namespace: monitoring }
data:
  mesh-security.json: |
    {
      "title": "Mesh Security",
      "uid": "mesh-security",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "timeseries", "title": "Authz DENIALS (403) by source principal",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60 } } },
          "targets": [ {
            "expr": "sum by (source_workload, destination_workload) (rate(istio_requests_total{response_code=\"403\"}[1m]))",
            "legendFormat": "{{source_workload}} -> {{destination_workload}}"
          } ]
        },
        {
          "type": "timeseries", "title": "Requests by response code",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "targets": [ {
            "expr": "sum by (response_code) (rate(istio_requests_total[1m]))",
            "legendFormat": "{{response_code}}"
          } ]
        },
        {
          "type": "stat", "title": "mTLS coverage (% mutual_tls inbound)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [ {
            "expr": "100 * sum(rate(istio_requests_total{connection_security_policy=\"mutual_tls\", reporter=\"destination\"}[5m])) / clamp_min(sum(rate(istio_requests_total{reporter=\"destination\"}[5m])), 1)"
          } ]
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata: { name: grafana-admin, namespace: monitoring }
type: Opaque
stringData:
  admin-password: "changeme-driftscope"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring, labels: { app: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-password } } }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }
            - { name: GF_USERS_DEFAULT_THEME, value: "light" }
          ports: [ { containerPort: 3000, name: http } ]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dash-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dash-provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  selector: { app: grafana }
  ports: [ { port: 3000, targetPort: 3000 } ]
