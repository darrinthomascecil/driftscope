apiVersion: v1
kind: Namespace
metadata:
  name: monitoring        # deliberately NOT istio-injected: Prometheus stays out of mesh so it can
                          # scrape sidecar metrics (port 15090) without deny-all / STRICT blocking it
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus }
rules:
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: monitoring }
data:
  prometheus.yml: |
    global: { scrape_interval: 15s, evaluation_interval: 15s }
    rule_files: [ /etc/prometheus/security-rules.yml ]
    scrape_configs:
      - job_name: istio-proxies
        metrics_path: /stats/prometheus
        kubernetes_sd_configs: [ { role: pod } ]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: istio-proxy
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:15090'
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: k8s_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: k8s_pod
  security-rules.yml: |
    groups:
      - name: mesh-security
        rules:
          # Attack #2: lateral movement -- a non-gateway principal denied by authz.
          - alert: MeshAuthzDenied
            expr: sum by (source_workload, source_principal, destination_workload) (rate(istio_requests_total{response_code="403"}[2m])) > 0
            for: 0m
            labels: { severity: critical }
            annotations:
              summary: "In-mesh request DENIED by authz (possible lateral movement)"
              description: "{{ $labels.source_workload }} ({{ $labels.source_principal }}) -> {{ $labels.destination_workload }} got 403."
          # Attack #3: plaintext reaching the app -- ANY request to a workload not over mutual_tls.
          - alert: NonMutualTLSToWorkload
            expr: sum by (destination_workload, connection_security_policy) (rate(istio_requests_total{connection_security_policy!="mutual_tls", destination_workload!=""}[2m])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "Non-mTLS request reached {{ $labels.destination_workload }} ({{ $labels.connection_security_policy }})"
          # Attack #1: probing/fuzzing -- a spike of unauthenticated redirects at the gateway.
          - alert: SSOUnauthenticatedSpike
            expr: sum(rate(istio_requests_total{response_code="302"}[2m])) > 5
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "Elevated unauthenticated (302) rate at the gateway -- possible auth probing"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring, labels: { app: prometheus } }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h        # tiny retention; this is a demo/security-signal store
            - --storage.tsdb.path=/prometheus
          ports: [ { containerPort: 9090, name: http } ]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 700Mi }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  selector: { app: prometheus }
  ports: [ { port: 9090, targetPort: 9090 } ]
