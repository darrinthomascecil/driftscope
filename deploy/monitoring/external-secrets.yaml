# TEMPLATE (ADR 0001): committed placeholders, bound at deploy time by render-overlay.sh
# (RENDER_TARGET=monitoring) from Terraform's eso_client_id / tenant_id / key_vault_name outputs --
# nothing secret is committed.
#
# ESO pulls the monitoring stack's secrets from Key Vault and syncs them into the `monitoring`
# namespace: grafana-admin (admin login) + alertmanager-webhook (delivery URL). It auths with Workload
# Identity via the driftscope-eso ServiceAccount -- the SAME eso identity as the app (Key Vault Secrets
# User), which secrets.tf also federates to system:serviceaccount:monitoring:driftscope-eso.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftscope-eso
  namespace: monitoring
  annotations:
    azure.workload.identity/client-id: "REPLACE-ESO-CLIENT-ID"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: driftscope-kv
  namespace: monitoring
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      tenantId: "REPLACE-TENANT-ID"
      vaultUrl: "https://REPLACE-KEYVAULT.vault.azure.net/"
      serviceAccountRef:
        name: driftscope-eso
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: driftscope-kv
    kind: SecretStore
  target:
    name: grafana-admin        # the Secret grafana.yaml reads (GF_SECURITY_ADMIN_PASSWORD)
    creationPolicy: Owner       # ESO owns + reconciles this Secret (Argo never prunes it)
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: driftscope-kv
    kind: SecretStore
  target:
    name: alertmanager-webhook  # the Secret alertmanager.yaml mounts at /etc/alertmanager/secrets
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alertmanager-webhook-url
