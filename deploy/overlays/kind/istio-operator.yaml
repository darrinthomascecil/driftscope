# Registers oauth2-proxy as an Istio ext_authz extensionProvider in UPSTREAM istiod's meshConfig
# (the cloud does the same via the managed-mesh istio-shared-configmap-asm-1-29). Re-applied with
# `istioctl install -f` so istiod reconciles the provider without disturbing the gateway/app.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: default
  meshConfig:
    extensionProviders:
      - name: oauth2-proxy
        envoyExtAuthzHttp:
          service: oauth2-proxy.driftscope.svc.cluster.local
          port: 4180
          includeRequestHeadersInCheck: ["authorization", "cookie", "x-forwarded-for"]
          headersToUpstreamOnAllow: ["authorization", "path", "x-auth-request-user", "x-auth-request-email", "x-auth-request-access-token"]
          headersToDownstreamOnDeny: ["content-type", "set-cookie", "location"]
