# LOCAL analogue of deploy/overlays/cloud/edge/cluster-issuer.yaml. The cloud proves control of a
# PUBLIC DNS zone via Let's Encrypt DNS-01 (needs public reachability we don't have locally); here we
# stand up our OWN self-signed root CA and issue from it. Same cert-manager object model, different
# trust anchor. Trust the root once in the OS keychain (see README) to get a green padlock.
#
# Chain: SelfSigned ClusterIssuer --bootstraps--> root CA Certificate (isCA) --backs--> CA ClusterIssuer.
---
# 1. Bootstrap issuer: signs a cert with its own key (self-signed). Only used to mint the root CA below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
# 2. The root CA. Self-signed by the issuer above; isCA:true makes it a signing CA. Its key+cert land in
#    secret `driftscope-local-ca` IN THE cluster-resource-namespace (cert-manager, = the release ns) --
#    that's where a ClusterIssuer of kind CA reads its signing material from.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: driftscope-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: driftscope-local-ca
  secretName: driftscope-local-ca
  duration: 43800h   # 5y -- a root CA outlives the leaves it signs
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
---
# 3. The CA issuer every leaf cert issues from. Reads the root's key+cert from the secret above.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: driftscope-local-ca
spec:
  ca:
    secretName: driftscope-local-ca
