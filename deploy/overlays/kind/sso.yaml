# Kind SSO layer: oauth2-proxy (Entra OIDC relying party) as the gateway ext_authz, mirroring
# deploy/overlays/cloud/oauth2-proxy.yaml + require-sso.authorizationpolicy.yaml. Client secret +
# cookie secret come from the oauth2-proxy-creds Secret (created out-of-band, not committed).
# Redirect is http://localhost:8443 (the gateway port-forward), registered on the driftscope-kind-sso app.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: oauth2-proxy, namespace: driftscope, labels: { app: oauth2-proxy } }
spec:
  replicas: 1
  selector: { matchLabels: { app: oauth2-proxy } }
  template:
    metadata: { labels: { app: oauth2-proxy } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 2000 }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=static://200
            - --email-domain=*
            - --oidc-email-claim=preferred_username
            - --insecure-oidc-allow-unverified-email=true
            - --scope=openid profile email
            - --cookie-secure=false            # localhost is http (no TLS on the port-forward)
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --set-authorization-header=true
            - --skip-provider-button=true
            - --cookie-csrf-per-request=true
            - --cookie-csrf-expire=5m
          env:
            - { name: OAUTH2_PROXY_OIDC_ISSUER_URL, value: "https://login.microsoftonline.com/REPLACE-TENANT-ID/v2.0" }
            - { name: OAUTH2_PROXY_REDIRECT_URL, value: "http://localhost:8443/oauth2/callback" }
            - { name: OAUTH2_PROXY_WHITELIST_DOMAINS, value: "localhost:8443" }
            - { name: OAUTH2_PROXY_CLIENT_ID, value: "REPLACE-CLIENT-ID" }
            - { name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM, value: "groups" }
            - { name: OAUTH2_PROXY_ALLOWED_GROUPS, value: "REPLACE-ALLOWED-GROUP-ID" }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy-creds, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy-creds, key: cookie-secret } }
          ports: [ { name: http, containerPort: 4180 } ]
          readinessProbe: { httpGet: { path: /ping, port: 4180 }, initialDelaySeconds: 2, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: oauth2-proxy, namespace: driftscope }
spec:
  selector: { app: oauth2-proxy }
  ports: [ { name: http, port: 4180, targetPort: 4180 } ]
---
# oauth2-proxy accepts inbound ONLY from the ingress gateway (same lockdown as the app).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: oauth2-proxy-allow-gateway, namespace: driftscope }
spec:
  selector: { matchLabels: { app: oauth2-proxy } }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [ "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account" ]
---
# Routing: oauth2-proxy owns /oauth2/*; everything else -> the app (behind the SSO gate below).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: driftscope, namespace: driftscope }
spec:
  hosts: [ "*" ]
  gateways: [ "driftscope" ]
  http:
    - match: [ { uri: { prefix: /oauth2/ } } ]
      route:
        - destination: { host: oauth2-proxy.driftscope.svc.cluster.local, port: { number: 4180 } }
    - route:
        - destination: { host: driftscope.driftscope.svc.cluster.local, port: { number: 80 } }
---
# Force the ext_authz (oauth2-proxy) check on the gateway for every request except oauth2-proxy's
# own endpoints and the health probe. Mirrors require-sso.authorizationpolicy.yaml.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: driftscope-require-sso, namespace: istio-system }
spec:
  selector: { matchLabels: { istio: ingressgateway } }
  action: CUSTOM
  provider: { name: oauth2-proxy }
  rules:
    - to:
        - operation:
            notPaths: ["/oauth2/*", "/healthz"]
