# Helm values for the istio/istiod chart on the local kind cluster (UPSTREAM Istio, installed via Helm).
# Registers oauth2-proxy as an ext_authz extensionProvider in istiod's meshConfig; the cloud does the
# equivalent via the managed-mesh shared configmap. Apply with:
#   helm upgrade --install istio-base istio/base   -n istio-system --create-namespace
#   helm upgrade --install istiod     istio/istiod -n istio-system -f istiod-values.yaml --wait
#   helm upgrade --install istio-ingressgateway istio/gateway -n istio-system --wait
meshConfig:
  extensionProviders:
    - name: oauth2-proxy
      envoyExtAuthzHttp:
        service: oauth2-proxy.driftscope.svc.cluster.local
        port: 4180
        includeRequestHeadersInCheck: ["authorization", "cookie", "x-forwarded-for"]
        headersToUpstreamOnAllow: ["authorization", "path", "x-auth-request-user", "x-auth-request-email", "x-auth-request-access-token"]
        headersToDownstreamOnDeny: ["content-type", "set-cookie", "location"]
