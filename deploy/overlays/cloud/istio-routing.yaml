# Mesh entry + routing for driftscope, fronted by the AKS managed-Istio internal
# ingress gateway. Namespace is injected by the kustomization (namespace: driftscope).
#
# Request path: Cloudflare -> tunnel -> cloudflared (out of mesh) -> this Gateway
#   -> VirtualService -> mTLS -> app sidecar. /oauth2/* is peeled off to oauth2-proxy.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: driftscope
spec:
  selector:
    istio: aks-istio-ingressgateway-internal   # managed internal gateway (no public IP)
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["driftscope.justmakeitgo.net"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: driftscope
spec:
  hosts: ["driftscope.justmakeitgo.net"]
  gateways: ["driftscope"]
  http:
    # oauth2-proxy owns its login/callback endpoints; these bypass the ext_authz
    # check (see mesh/require-sso.authorizationpolicy.yaml notPaths) and route here.
    - match:
        - uri: { prefix: /oauth2/ }
      route:
        - destination:
            host: oauth2-proxy.driftscope.svc.cluster.local
            port: { number: 4180 }
    # pathtrace demo (examples/pathtrace) -- still behind the SSO gate + mTLS, so it
    # exercises the full path it describes.
    - match:
        - uri: { prefix: /trace }
      route:
        - destination:
            host: pathtrace.driftscope.svc.cluster.local
            port: { number: 8080 }
    # everything else -> the app (gated by the CUSTOM AuthorizationPolicy on the gateway)
    - route:
        - destination:
            host: driftscope.driftscope.svc.cluster.local
            port: { number: 80 }
---
# Assume-breach posture: the app sidecar refuses any non-mTLS connection.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
---
# Defense in depth: STRICT mTLS alone only proves the caller has *some* mesh
# identity. Without this, any workload in the mesh could reach the app directly and
# bypass the gateway's SSO gate (verified: an in-mesh probe got 200). This restricts
# the app's inbound to the ingress gateway's identity ONLY, so the sole path to the
# app is through the gateway (and therefore through oauth2-proxy).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: driftscope-allow-gateway-only
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: driftscope
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aks-istio-ingress/sa/aks-istio-ingressgateway-internal
