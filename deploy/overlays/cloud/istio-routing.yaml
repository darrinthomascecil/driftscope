# Mesh entry + routing for driftscope, fronted by the AKS managed-Istio EXTERNAL
# ingress gateway. Namespace is injected by the kustomization (namespace: driftscope).
#
# Request path: Front Door -> external gateway public IP -> this Gateway -> VirtualService
#   -> mTLS -> app sidecar. /oauth2/* is peeled off to oauth2-proxy. Leg 2 (Front Door ->
#   gateway) is HTTPS on :443 with a cert-manager cert in custom-domain mode, else HTTP on :80.
#   See docs/design-edge-origin-cert.md.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: driftscope
spec:
  selector:
    istio: aks-istio-ingressgateway-external   # managed external gateway (BYO public IP)
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["REPLACE-HOST"]   # <- overwritten by kustomize replacements (params.HOST); placeholder, ADR 0001
    # HTTPS origin listener (custom-domain mode). Front Door dials origin.<domain> (SNI); the
    # gateway presents the cert-manager cert in secret driftscope-origin-tls (issued into
    # aks-istio-ingress, the gateway's own namespace, where Istio reads credentialName secrets).
    # hosts:["*"] so any SNI terminates with that cert -- HTTP routing still keys off the Host
    # header (the public HOST) via the VirtualService below. In demo mode the secret is absent
    # and this listener stays dormant while Front Door uses the :80 HTTP origin. Harmless either way.
    - port: { number: 443, name: https, protocol: HTTPS }
      hosts: ["*"]
      tls:
        mode: SIMPLE
        credentialName: driftscope-origin-tls
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: driftscope
spec:
  hosts: ["REPLACE-HOST"]   # <- overwritten by kustomize replacements (params.HOST); placeholder, ADR 0001
  gateways: ["driftscope"]
  http:
    # oauth2-proxy owns its login/callback endpoints; these bypass the ext_authz
    # check (see mesh/require-sso.authorizationpolicy.yaml notPaths) and route here.
    - match:
        - uri: { prefix: /oauth2/ }
      route:
        - destination:
            host: oauth2-proxy.driftscope.svc.cluster.local
            port: { number: 4180 }
    # pathtrace demo (examples/pathtrace) -- still behind the SSO gate + mTLS, so it
    # exercises the full path it describes.
    - match:
        - uri: { prefix: /trace }
      route:
        - destination:
            host: pathtrace.driftscope.svc.cluster.local
            port: { number: 8080 }
    # fleet governance service (docs/design-org-aggregation.md) -- UI + verdict/inventory
    # API. Behind the same SSO gate + origin lock as the app; the sole path in is the gateway.
    - match:
        - uri: { prefix: /fleet }
      route:
        - destination:
            host: driftscope-fleet.driftscope.svc.cluster.local
            port: { number: 80 }
    # everything else -> the app (gated by the CUSTOM AuthorizationPolicy on the gateway)
    - route:
        - destination:
            host: driftscope.driftscope.svc.cluster.local
            port: { number: 80 }
---
# Assume-breach posture: the app sidecar refuses any non-mTLS connection.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
---
# Defense in depth: STRICT mTLS alone only proves the caller has *some* mesh
# identity. Without this, any workload in the mesh could reach the app directly and
# bypass the gateway's SSO gate (verified: an in-mesh probe got 200). This restricts
# the app's inbound to the ingress gateway's identity ONLY, so the sole path to the
# app is through the gateway (and therefore through oauth2-proxy).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: driftscope-allow-gateway-only
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: driftscope
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aks-istio-ingress/sa/aks-istio-ingressgateway-external
