# GENERATED by terraform (terraform/secrets.tf). Do not hand-edit; change terraform.tfvars and
# `terraform apply`. Namespace (driftscope) is injected by the kustomization.
#
# External Secrets Operator pulls the oauth2-proxy credentials from Key Vault and syncs them into
# the `oauth2-proxy` Secret the Deployment reads -- replacing the manual `make secret`. ESO auths
# with Workload Identity via the driftscope-eso ServiceAccount (Key Vault Secrets User).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftscope-eso
  annotations:
    azure.workload.identity/client-id: "REPLACE-ESO-CLIENT-ID"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: driftscope-kv
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://REPLACE-KEYVAULT.vault.azure.net/"
      serviceAccountRef:
        name: driftscope-eso
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: driftscope-kv
    kind: SecretStore
  target:
    name: oauth2-proxy      # the Secret oauth2-proxy.yaml reads (client-id/client-secret/cookie-secret)
    creationPolicy: Owner    # ESO owns + reconciles this Secret
  data:
    - secretKey: client-id
      remoteRef:
        key: oauth2-proxy-client-id
    - secretKey: client-secret
      remoteRef:
        key: oauth2-proxy-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy-cookie-secret
