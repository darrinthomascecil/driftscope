# Cloudflare Tunnel connector: dials OUT to Cloudflare and serves the app through the
# tunnel, so the origin needs no public IP. Reaches the driftscope Service in-cluster.
# The tunnel token lives in a Secret (cloudflared-token) created out-of-band, never git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: driftscope
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2                      # two connectors for HA (Cloudflare load-balances them)
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest   # pin to a release tag for prod
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 5
            periodSeconds: 10
