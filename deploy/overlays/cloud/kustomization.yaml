apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: driftscope
resources:
  - ../../base
  - networkpolicy.yaml
images:
  - name: driftscope
    newName: dscopeacr18860.azurecr.io/driftscope
    newTag: v1
replicas:
  - name: driftscope
    count: 1
configMapGenerator:
  - name: driftscope-config
    envs:
      - config.env
patches:
  - target: {kind: ServiceAccount, name: driftscope}
    patch: |-
      - op: remove
        path: /metadata/annotations/azure.workload.identity~1client-id
  - target: {kind: Deployment, name: driftscope}
    patch: |-
      - op: remove
        path: /spec/template/metadata/labels/azure.workload.identity~1use
  - target: {kind: Service, name: driftscope}
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 80
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/azure-dns-label-name: driftscope-18860
