apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: driftscope
resources:
  - ../../base
  - cloudflared.yaml
  - oauth2-proxy.yaml     # Entra OIDC relying party (Istio ext_authz provider)
  - istio-routing.yaml    # Gateway + VirtualService + STRICT mTLS
  - networkpolicy.yaml    # egress lockdown (blocks IMDS + private ranges)
  # Cluster-scoped mesh objects (ext_authz provider, gateway AuthorizationPolicy) live
  # in mesh/ and are applied directly -- see mesh/README.md.
images:
  - name: driftscope
    newName: dscopeacr18860.azurecr.io/driftscope
    newTag: v1
replicas:
  - name: driftscope
    count: 1
configMapGenerator:
  - name: driftscope-config
    envs:
      - config.env
patches:
  - target: {kind: ServiceAccount, name: driftscope}
    patch: |-
      - op: remove
        path: /metadata/annotations/azure.workload.identity~1client-id
  - target: {kind: Deployment, name: driftscope}
    patch: |-
      - op: remove
        path: /spec/template/metadata/labels/azure.workload.identity~1use
  - target: {kind: Service, name: driftscope}
    patch: |-
      # ClusterIP only -- reached via the Cloudflare Tunnel, no public IP.
      - op: replace
        path: /spec/ports/0/port
        value: 80
