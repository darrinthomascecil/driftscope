apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: driftscope
resources:
  - ../../base
  - params.yaml           # DEPLOYMENT PARAMETERS -- edit to deploy your own (host/tenant/group)
  - oauth2-proxy.yaml     # Entra OIDC relying party (Istio ext_authz provider) + group gate
  - oauth2-proxy-templates.yaml   # custom "no access" page for non-group members
  - external-secrets.yaml # ESO: sync oauth2-proxy creds from Key Vault (Terraform-generated, 0.6b)
  - istio-routing.yaml    # Gateway + VirtualService + STRICT mTLS
  - networkpolicy.yaml    # egress lockdown (blocks IMDS + private ranges)
  - fleet.yaml            # org-wide governance service (docs/design-org-aggregation.md)
  # Gateway-namespace objects are applied directly, outside this kustomization:
  #   mesh/  -- ext_authz provider, mesh-wide STRICT + default-deny, path normalization
  #   edge/  -- origin TLS (cert-manager) + X-Azure-FDID origin lock (Terraform-generated)
images:
  # The registry is a per-deployment PARAMETER (ADR 0001): render-overlay.sh binds newName from
  # Terraform's acr_login_server output at deploy time. The TAG is a semantic version and the single
  # source of truth for the deployed version (ADR 0002 phase 4): cutting a release (a `vX.Y.Z` git
  # tag) makes the deploy pipeline build that version and bump this newTag via a commit; Argo CD
  # reconciles it. A rebuild builds this exact version tag, so it is reproducible. Bump via a release,
  # not by hand.
  - name: driftscope
    newName: REPLACE-IMAGE-REPO
    newTag: v0.1.1

# Inject the public HOST (from driftscope-params) into the Istio Gateway + VirtualService, so the
# routing isn't hardcoded to a domain. The literals in istio-routing.yaml are overwritten here.
replacements:
  - source:
      kind: ConfigMap
      name: driftscope-params
      fieldPath: data.HOST
    targets:
      - select: { kind: Gateway, name: driftscope }
        fieldPaths: [spec.servers.0.hosts.0]
      - select: { kind: VirtualService, name: driftscope }
        fieldPaths: [spec.hosts.0]
replicas:
  - name: driftscope
    count: 1
configMapGenerator:
  - name: driftscope-config
    envs:
      - config.env
# The app pod runs UNDER Workload Identity here (driftscope-app UAMI, terraform/app-identity.tf):
# secretless ADO scanning + forge-auth Key Vault signing/secret reads (docs/forge-auth.md).
#
# This overlay once STRIPPED workload identity -- back when it was a public-repo-only, open
# endpoint (commit 3e51039), so an Azure identity would have been a confused-deputy risk. That
# rationale lapsed: the endpoint is now behind oauth2-proxy SSO (Entra group gate) + the Front
# Door origin lock, and forge-auth needs the pod's identity to reach Key Vault. Do NOT re-add a
# patch that removes azure.workload.identity/* -- tests/test_deploy_wi.py guards against it.
patches:
  - path: patch-sa.yaml   # set the SA's azure.workload.identity/client-id (Terraform-generated)
  - target: {kind: Service, name: driftscope}
    patch: |-
      # ClusterIP only -- reached in-cluster via the Istio gateway (Front Door is the sole
      # public entry point); the app Service itself has no public IP.
      - op: replace
        path: /spec/ports/0/port
        value: 80
