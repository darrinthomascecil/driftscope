# DEPLOYMENT PARAMETERS -- a TEMPLATE (see docs/adr/0001-deployment-configuration-and-secrets.md).
#
# This committed form holds only REPLACE-* placeholders. The real per-deployment values (host,
# tenant, group) are injected at DEPLOY time from Azure/Terraform outputs by the deploy pipeline
# (.github/workflows/deploy.yml) -- so no live identifier is ever committed to git, and a clone is
# a clean template. Values are ATOMIC; oauth2-proxy composes the OIDC issuer / redirect URLs from
# them at runtime via Kubernetes $(VAR) env expansion (never edit a URL with an id buried in it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: driftscope-params
  namespace: driftscope
data:
  # Public hostname the app is served at. Also flows into the Istio Gateway/VirtualService hosts
  # (kustomize replacement on data.HOST) and oauth2-proxy's redirect/cookie/whitelist (via $(HOST)).
  HOST: "REPLACE-HOST"
  # Entra (Azure AD) tenant id. Composed into the OIDC issuer URL at runtime.
  TENANT_ID: "REPLACE-TENANT-ID"
  # Entra security group whose members may access the app: object id + display name (page text).
  ALLOWED_GROUP_ID: "REPLACE-ALLOWED-GROUP-ID"
  ALLOWED_GROUP_NAME: "driftscope"
  # NOTE: the Front Door edge config (origin cert + X-Azure-FDID origin lock) is NOT here -- it
  # lives in the gateway namespace (aks-istio-ingress), generated into edge/ by terraform/edge.tf.
  # This ConfigMap is strictly the app-consumed config.
