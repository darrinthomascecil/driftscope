# TEMPLATE (ADR 0001): a committed placeholder, bound at DEPLOY time by render-edge.sh from
# Terraform's origin_host output -- Terraform no longer writes this file. Custom-domain mode only.
# See deploy/overlays/cloud/edge/README.md for apply order + prerequisites.
# The origin certificate. cert-manager issues a cert for the origin host via the DNS-01
# ClusterIssuer and stores it in secret `driftscope-origin-tls` IN THE GATEWAY'S NAMESPACE
# (aks-istio-ingress) -- that's where Istio reads `credentialName` secrets from, regardless of
# where the Gateway resource lives. The Gateway :443 server serves it (see istio-routing.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: driftscope-origin
  namespace: aks-istio-ingress
spec:
  secretName: driftscope-origin-tls
  duration: 2160h    # 90d
  renewBefore: 720h  # renew 30d out -- DNS-01, so renewal is unattended
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - REPLACE-ORIGIN-HOST
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
