# TEMPLATE (ADR 0001): a committed placeholder, bound at DEPLOY time by render-edge.sh from
# Terraform outputs -- Terraform no longer writes this file. Custom-domain mode only. See
# deploy/overlays/cloud/edge/README.md for apply order + prerequisites.
# Let's Encrypt DNS-01 issuer for the ORIGIN certificate. cert-manager proves control of the DNS
# zone by writing _acme-challenge TXT records via the managed identity below (Workload Identity --
# no client secret). Then it issues the cert Front Door validates on leg 2.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE-ACME-EMAIL   # optional (LE allows an anonymous account); render-edge.sh drops the line if unset
    privateKeySecretRef:
      name: letsencrypt-dns-account-key
    solvers:
      - dns01:
          azureDNS:
            hostedZoneName: REPLACE-DNS-ZONE
            resourceGroupName: REPLACE-RESOURCE-GROUP
            subscriptionID: REPLACE-SUBSCRIPTION-ID
            environment: AzurePublicCloud
            managedIdentity:
              clientID: REPLACE-CERTMANAGER-CLIENT-ID
