#
# ORIGIN LOCK. The gateway has a PUBLIC IP, so anyone who learns it could talk to it directly and
# skip Front Door (and its WAF). This DENIES any request whose X-Azure-FDID header is not THIS
# Front Door profile's GUID -- and Front Door stamps that header on every request it forwards. A
# missing header is denied too (absent != the GUID). Belt-and-suspenders: the public IP is also
# scoped to the AzureFrontDoor.Backend service tag. Applies in BOTH modes (HTTP and HTTPS origin).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: driftscope-origin-lock
  namespace: aks-istio-ingress
spec:
  selector:
    matchLabels:
      istio: aks-istio-ingressgateway-external
  action: DENY
  rules:
    - when:
        - key: request.headers[x-azure-fdid]
          notValues: ["REPLACE-FRONT-DOOR-GUID"]
