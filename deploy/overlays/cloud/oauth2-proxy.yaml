# Entra (Azure AD) OIDC relying party, run as an Istio ext_authz provider (not in
# the data path). Namespace injected by the kustomization (namespace: driftscope).
#
# Access is gated on Entra GROUP membership: only members of the group whose object id is
# in the driftscope-access ConfigMap (ALLOWED_GROUP_ID) may in; everyone else authenticated
# gets the custom "no access" page (oauth2-proxy-templates/error.html). The app must emit
# group claims: `az ad app update --id <app> --set groupMembershipClaims=SecurityGroup`.
#
# The `oauth2-proxy` Secret is NOT in git. Create it from Key Vault before applying:
#   CID=$(az keyvault secret show --vault-name dscopeclddev01 -n oauth2-proxy-client-id --query value -o tsv)
#   CSECRET=$(az keyvault secret show --vault-name dscopeclddev01 -n oauth2-proxy-client-secret --query value -o tsv)
#   COOKIE=$(openssl rand -hex 16)
#   kubectl -n driftscope create secret generic oauth2-proxy \
#     --from-literal=client-id="$CID" --from-literal=client-secret="$CSECRET" --from-literal=cookie-secret="$COOKIE"
# NOTE: store the client secret VALUE (`password`), never the credential keyId (AADSTS7000215).
---
# Parameters for group-based access. Swap the group by editing ALLOWED_GROUP_ID (and the
# display name shown on the no-access page). ALLOWED_GROUP_ID is an Entra group OBJECT ID.
apiVersion: v1
kind: ConfigMap
metadata:
  name: driftscope-access
  namespace: driftscope
data:
  ALLOWED_GROUP_ID: "82cb7474-d489-4fd7-b7e4-d7d6fad74d0c"   # Entra group "driftscope"
  ALLOWED_GROUP_NAME: "driftscope"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels: { app: oauth2-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app: oauth2-proxy }
  template:
    metadata:
      labels: { app: oauth2-proxy }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://login.microsoftonline.com/f493fd7e-e41b-4f64-ad3d-a9704bbfb5f8/v2.0
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=static://200
            - --redirect-url=https://driftscope.justmakeitgo.net/oauth2/callback
            - --email-domain=*
            - --oidc-email-claim=preferred_username
            - --insecure-oidc-allow-unverified-email=true
            - --scope=openid profile email
            - --cookie-secure=true
            - --cookie-domain=driftscope.justmakeitgo.net
            - --whitelist-domain=driftscope.justmakeitgo.net
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --set-authorization-header=true
            - --skip-provider-button=true
            - --custom-templates-dir=/templates          # the "no access" page (error.html)
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
            # --- Entra group gate: only members of ALLOWED_GROUP_ID get in ---
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              valueFrom: { configMapKeyRef: { name: driftscope-access, key: ALLOWED_GROUP_ID } }
            - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
              value: "groups"                              # Entra emits security-group object ids here
          ports:
            - { name: http, containerPort: 4180 }
          volumeMounts:
            - { name: templates, mountPath: /templates, readOnly: true }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: templates
          configMap: { name: oauth2-proxy-templates }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  labels: { app: oauth2-proxy }
spec:
  selector: { app: oauth2-proxy }
  ports:
    - { name: http, port: 4180, targetPort: 4180 }
---
# Under the mesh-wide deny-all (mesh/hardening.yaml), oauth2-proxy is reachable ONLY by
# the ingress gateway's identity -- the same lockdown as the app.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: oauth2-proxy-allow-gateway
spec:
  selector:
    matchLabels: { app: oauth2-proxy }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aks-istio-ingress/sa/aks-istio-ingressgateway-internal
