# Entra (Azure AD) OIDC relying party, run as an Istio ext_authz provider (not in the data
# path). Namespace injected by the kustomization (namespace: driftscope).
#
# Deployment-specific values (host, tenant, group) come from the driftscope-params ConfigMap
# (params.yaml). The composed strings -- OIDC issuer URL and the oauth2 redirect/cookie/whitelist
# -- are built at runtime with Kubernetes $(VAR) env expansion, so nothing here is hardcoded to a
# domain or tenant. Access is gated on Entra GROUP membership (ALLOWED_GROUP_ID); non-members get
# the custom no-access page (oauth2-proxy-templates/error.html). The app must emit group claims:
# `az ad app update --id <app> --set groupMembershipClaims=SecurityGroup`.
#
# The `oauth2-proxy` Secret is NOT in git. By default it is synced from Key Vault by External
# Secrets Operator -- see external-secrets.yaml (Terraform-generated) and the ExternalSecret named
# `oauth2-proxy`, which maps oauth2-proxy-{client-id,client-secret,cookie-secret} into this Secret.
# No human runs `kubectl create secret`. Fallback for clusters without ESO: `make secret`
# (scripts/bootstrap/secret.sh). NOTE: the Key Vault holds the client secret VALUE (`password`),
# never the credential keyId (AADSTS7000215).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels: { app: oauth2-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app: oauth2-proxy }
  template:
    metadata:
      labels: { app: oauth2-proxy }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=static://200
            - --email-domain=*
            - --oidc-email-claim=preferred_username
            - --insecure-oidc-allow-unverified-email=true
            - --scope=openid profile email
            - --cookie-secure=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --set-authorization-header=true
            - --skip-provider-button=true
            - --custom-templates-dir=/templates          # the "no access" page (error.html)
          env:
            # --- atomic params (from driftscope-params); ordered first so $(VAR) can expand them ---
            - name: HOST
              valueFrom: { configMapKeyRef: { name: driftscope-params, key: HOST } }
            - name: TENANT_ID
              valueFrom: { configMapKeyRef: { name: driftscope-params, key: TENANT_ID } }
            # --- composed at runtime via $(VAR) -- no domain/tenant hardcoded ---
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: "https://login.microsoftonline.com/$(TENANT_ID)/v2.0"
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: "https://$(HOST)/oauth2/callback"
            - name: OAUTH2_PROXY_COOKIE_DOMAINS
              value: "$(HOST)"
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: "$(HOST)"
            # --- Entra group gate: only members of ALLOWED_GROUP_ID get in ---
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              valueFrom: { configMapKeyRef: { name: driftscope-params, key: ALLOWED_GROUP_ID } }
            - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
              value: "groups"
            # --- secrets (out of git; created from Key Vault) ---
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
          ports:
            - { name: http, containerPort: 4180 }
          volumeMounts:
            - { name: templates, mountPath: /templates, readOnly: true }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: templates
          configMap: { name: oauth2-proxy-templates }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  labels: { app: oauth2-proxy }
spec:
  selector: { app: oauth2-proxy }
  ports:
    - { name: http, port: 4180, targetPort: 4180 }
---
# Under the mesh-wide deny-all (mesh/hardening.yaml), oauth2-proxy is reachable ONLY by
# the ingress gateway's identity -- the same lockdown as the app.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: oauth2-proxy-allow-gateway
spec:
  selector:
    matchLabels: { app: oauth2-proxy }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aks-istio-ingress/sa/aks-istio-ingressgateway-external
