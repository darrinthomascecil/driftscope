apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: driftscope
spec:
  parentRefs:
    - name: driftscope
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: driftscope
          port: 8080
      # See the dev overlay's note: generous per-request timeout for single-repo scans;
      # the fleet path belongs on the async job model, not a larger number.
      timeouts:
        request: 300s
