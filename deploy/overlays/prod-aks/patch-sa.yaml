apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftscope
  annotations:
    # The prod AKS UAMI's client-id. Federated to the prod AKS managed OIDC issuer with
    # subject system:serviceaccount:driftscope:driftscope (same subject as every env).
    azure.workload.identity/client-id: "<PROD_UAMI_CLIENT_ID>"
