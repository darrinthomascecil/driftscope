apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod AKS. Promote the SAME image digest validated in dev rather than rebuilding.
# Exposed via Application Gateway for Containers. Replace the <PLACEHOLDERS>.
namespace: driftscope
resources:
  - ../../base
  - gateway.yaml
  - httproute.yaml

images:
  - name: driftscope
    newName: <ACR_LOGIN_SERVER>/driftscope   # the prod (or shared) ACR
    newTag: <IMAGE_TAG>                       # the digest/tag promoted from dev

replicas:
  - name: driftscope
    count: 3

configMapGenerator:
  - name: driftscope-config
    envs:
      - config.env

patches:
  - path: patch-sa.yaml
