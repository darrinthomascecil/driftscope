apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftscope
  labels:
    app.kubernetes.io/name: driftscope
  annotations:
    # The UAMI this pod federates to. The value is set per environment by each
    # overlay's patch-sa.yaml -- the namespace/SA name stay `driftscope` everywhere so
    # the federated subject (system:serviceaccount:driftscope:driftscope) is identical
    # across clusters; only this client-id and the env's Key Vault differ.
    azure.workload.identity/client-id: "SET-PER-OVERLAY"
