apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Env-agnostic base. It is not applied directly -- overlays supply the namespace,
# image, the driftscope-config ConfigMap, and the per-env ServiceAccount client-id.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
