apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftscope
  labels:
    app.kubernetes.io/name: driftscope
    app.kubernetes.io/component: scan-service
spec:
  replicas: 1                       # the service is stateless; the on-disk cache is
  selector:                         # a per-pod performance cache, not state.
    matchLabels:
      app.kubernetes.io/name: driftscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: driftscope
        app.kubernetes.io/component: scan-service
        # Opt this pod into the azure-workload-identity mutating webhook: it injects
        # AZURE_CLIENT_ID / AZURE_FEDERATED_TOKEN_FILE / AZURE_AUTHORITY_HOST and the
        # projected api://AzureADTokenExchange token. No secret is mounted.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: driftscope
      # The image already runs as the unprivileged `drift` user (uid 1000). These
      # settings make that explicit and lock the container down: no root, no
      # privilege escalation, no capabilities, a read-only root filesystem with
      # writable scratch only where the app genuinely needs it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000               # makes the emptyDir volumes group-writable by drift
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driftscope
          image: driftscope:dev
          # kind loads the local image; AKS overlays repoint this at ACR via the
          # kustomize `images:` transformer. With a reused tag you MUST reload +
          # `rollout restart` for a change to take -- k8s serves the cached image.
          imagePullPolicy: IfNotPresent
          # ENTRYPOINT is `driftscope`; args replace the image's default CMD.
          args:
            - serve
            - --host=0.0.0.0
            - --port=8080
            - --allow-host=github.com
            - --allow-host=dev.azure.com
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DRIFTSCOPE_CACHE
              value: /cache
            - name: TMPDIR          # git clones land here; must be a writable mount
              value: /tmp
            - name: HOME
              value: /home/drift
          # Per-environment config (AZURE_TENANT_ID + the GITHUB_APP_* references,
          # incl. that env's Key Vault) comes from a ConfigMap the overlay generates.
          # AZURE_CLIENT_ID / the federated token are injected by the webhook, not here.
          envFrom:
            - configMapRef:
                name: driftscope-config
            # Optional token fallback (a PAT / az token) for clusters not using
            # workload identity. Absent under WI; the scan degrades to `unknown`
            # rather than failing if neither is present.
            - secretRef:
                name: driftscope-tokens
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /healthz is cheap and always-on; readiness gates traffic, liveness
          # restarts a wedged pod. A scan is slow but never blocks these.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/drift }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
