# pathtrace workload: Deployment + Service + its own workload-authz (the same
# gateway-only lockdown proven for driftscope, so this demo app is NOT itself an
# east-west SSO bypass). Lives in the meshed `driftscope` namespace, so it gets a
# sidecar automatically. The /trace route into it is added to the cloud overlay's
# istio-routing.yaml (VirtualService) -- see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathtrace
  namespace: driftscope
  labels: { app.kubernetes.io/name: pathtrace }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pathtrace }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pathtrace }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pathtrace
          image: dscopeacr18860.azurecr.io/pathtrace:v2
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: pathtrace
  namespace: driftscope
  labels: { app.kubernetes.io/name: pathtrace }
spec:
  selector: { app.kubernetes.io/name: pathtrace }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# Defense in depth (same as driftscope): only the ingress gateway's identity may
# reach pathtrace. Any other mesh workload -> 403.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pathtrace-allow-gateway-only
  namespace: driftscope
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: pathtrace }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aks-istio-ingress/sa/aks-istio-ingressgateway-internal
